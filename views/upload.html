<div class="bar">
  <h1>Upload a file</h1>
  <a class="btn secondary" href="{{home}}">Back to files</a>
</div>

<p id="limits" class="meta"></p>
<form id="uploadForm">
  <input id="file" type="file" required>
  <div id="preview" class="preview" hidden></div>
  <button id="previewBtn" type="button" class="secondary" hidden>Preview the result</button>
  <div id="result" class="review"></div>
  <input id="title" type="text" placeholder="Title (optional, shown on the download page)" maxlength="200" autocomplete="off">
  <input id="dpw" type="password" placeholder="Password for this download" required autocomplete="new-password">
  <label class="check"><input id="nopw" type="checkbox"> No password: anyone with the link can download</label>
  <label for="exp">Delete after</label>
  <select id="exp"></select>
  <button id="go">Upload</button>
  <progress id="bar" max="100" value="0" hidden></progress>
  <button id="cancel" type="button" class="secondary" hidden>Cancel upload</button>
</form>
<p id="msg"></p>

<script src="/static/common.js"></script>
<script src="/static/video-edit.js"></script>
<script src="/static/upload.js"></script>
