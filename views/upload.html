<h1>Upload a file</h1>
<input id="guest" type="text" placeholder="Guest name (leave empty for master)" autocomplete="off">
<input id="pw" type="password" placeholder="Master or guest password">
<input id="file" type="file">
<input id="dpw" type="password" placeholder="Password for this download">
<label for="exp">Delete after</label>
<select id="exp">
  <option value="0">Never (permanent)</option>
  <option value="10">10 minutes</option>
  <option value="60">1 hour</option>
  <option value="1440">1 day</option>
  <option value="10080">7 days</option>
  <option value="43200">30 days</option>
</select>
<button id="go">Upload</button>
<p id="msg"></p>
<script src="/static/upload.js"></script>
