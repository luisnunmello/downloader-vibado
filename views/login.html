<h1>Sign in</h1>
<form id="loginForm">
  <input id="name" type="text" placeholder="Guest name (leave empty for master)" autocomplete="username">
  <input id="pw" type="password" placeholder="Password" required autocomplete="current-password" autofocus>
  <button>Sign in</button>
</form>
<p id="msg" class="err"></p>
<p class="meta"><a href="/">Back</a></p>
<script src="/static/login.js"></script>
